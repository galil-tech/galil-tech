<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שיעור 10 – שקפים | גדלים למחר</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/slides-core.css">
</head>
<body>

<div id="deck-title">שיעור 10 – רובוטים בחקלאות: העתיד כבר פה?</div>
<div id="backdrop">

  <!-- שקף 1 - כרטיס-הנחיה: הפעילו סרטון Tevel (תבנית ייעודית) -->
  <section class="slide active" data-name="שקף 1">
    <div class="topbar">
      <span class="eyebrow">שיעור 10 · גדלים למחר</span>
      <span class="phase-chip">🌸 פאזה 3 – פריחה</span>
    </div>
    <div class="stage-center">
      <div class="cue-card" style="width:min(70%,600px);">
        <p class="play">▶️</p>
        <p class="h1" style="margin-top:12px;">הפעילו את סרטון Tevel Tech</p>
        <p class="small" style="margin-top:10px;">הרחפן הקוטף – computer vision בשדה</p>
      </div>
    </div>
    <div class="mascot">🌸</div>
  </section>

  <!-- שקף 2 - מה קשה לרובוט (תבנית B) -->
  <section class="slide" data-name="שקף 2" style="background:linear-gradient(160deg,#f0fdf4 0%, #ecfccb 100%);">
    <div class="topbar transparent">
      <span class="eyebrow">שיעור 10 · גדלים למחר</span>
      <span class="phase-chip">🌸 פאזה 3 – פריחה</span>
    </div>
    <div class="stage-center">
      <div>
        <p class="h1">מה קשה לרובוט לעשות —<br>שקל לאדם, ולהפך?</p>
      </div>
    </div>
    <div class="mascot">🌸</div>
  </section>

</div>

<div id="controls">
  <button class="navbtn" onclick="slidesGo(-1)">→</button>
  <span id="counter">1 / 2</span>
  <div id="dots"></div>
  <button class="navbtn" onclick="slidesGo(1)">←</button>
  <button class="navbtn" id="fsbtn" title="מסך מלא">⛶</button>
</div>

<script src="assets/slides-core.js"></script>
</body>
</html>
