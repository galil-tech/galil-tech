<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שיעור 4 – שקפים | גדלים למחר</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/slides-core.css">
</head>
<body>

<div id="deck-title">שיעור 4 – פוקוס על החקלאי: מה החקלאי צריך?</div>
<div id="backdrop">

  <!-- שקף 1 - עלות שדה: 30 שתילים, 90 ש"ח/חודש (תבנית A) -->
  <section class="slide active auto-anim" data-name="שקף 1" data-steps="0">
    <div class="topbar">
      <span class="eyebrow">שיעור 4 · גדלים למחר</span>
      <span class="phase-chip">🌱 פאזה 1 – נביטה</span>
    </div>
    <div class="stage-row" style="gap:5%;">
      <div style="flex:0 0 34%;">
        <p class="h1">כמה עולה לגדל שתיל?</p>
        <p class="body" style="margin-top:12px;">30 שתילים, השקיה+דשן: 90 ₪/חודש</p>
        <p class="small" style="margin-top:10px;">רווח לשתיל: <span class="counter counting" data-target="7" data-suffix=" ₪" style="font-weight:900; color:#166534;">0</span></p>
      </div>
      <div style="flex:1; height:70%; display:flex; flex-direction:column;">
        <div class="chart-row" style="height:80%; margin-bottom:10px;">
          <div class="growbar" data-height="30%" style="background:#fecaca;"></div>
          <div class="growbar" data-height="100%" style="background:#86efac;"></div>
          <div class="growbar" data-height="70%" style="background:#a3e635;"></div>
        </div>
        <div style="display:flex; gap:clamp(10px,2.2vw,28px); text-align:center;">
          <span class="label" style="flex:1; color:#b91c1c;">עלות · 3 ₪</span>
          <span class="label label-green" style="flex:1;">הכנסה · 10 ₪</span>
          <span class="label" style="flex:1; color:#4d7c0f;">רווח · 7 ₪</span>
        </div>
      </div>
    </div>
    <div class="mascot">🌱</div>
  </section>

  <!-- שקף 2 - "מה קורה אם חקלאי מפסיד שדה?" (תבנית B) -->
  <section class="slide" data-name="שקף 2" style="background:linear-gradient(160deg,#f0fdf4 0%, #ecfccb 100%);">
    <div class="topbar transparent">
      <span class="eyebrow">שיעור 4 · גדלים למחר</span>
      <span class="phase-chip">🌱 פאזה 1 – נביטה</span>
    </div>
    <div class="stage-center">
      <div>
        <p class="h1">מה קורה אם חקלאי<br>"מפסיד" שדה שלם —<br>בלי לדעת מוקדם?</p>
      </div>
    </div>
    <div class="mascot">🌱</div>
  </section>

</div>

<div id="controls">
  <button class="navbtn" onclick="slidesGo(-1)">→</button>
  <span id="counter">1 / 2</span>
  <div id="dots"></div>
  <button class="navbtn" onclick="slidesGo(1)">←</button>
  <button class="navbtn" id="fsbtn" title="מסך מלא">⛶</button>
</div>

<script src="assets/slides-core.js"></script>
</body>
</html>
