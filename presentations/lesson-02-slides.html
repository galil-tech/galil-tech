<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שיעור 2 – שקפים | גדלים למחר</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/slides-core.css">
</head>
<body>

<div id="deck-title">שיעור 2 – מהי חקלאות? מפרמה-קולצ'ר לחקלאות המחר</div>
<div id="backdrop">

  <!-- שקף 1 - פרמה-קולצ'ר (תבנית B) -->
  <section class="slide active" data-name="שקף 1" style="background:linear-gradient(160deg,#f0fdf4 0%, #ecfccb 100%);">
    <div class="topbar transparent">
      <span class="eyebrow">שיעור 2 · גדלים למחר</span>
      <span class="phase-chip">🌱 פאזה 1 – נביטה</span>
    </div>
    <div class="stage-center">
      <div>
        <p class="h1">פרמה-קולצ'ר —<br>חקלאות שמחזירה לטבע<br>מה שלוקחת ממנו</p>
      </div>
    </div>
    <div class="mascot">🌱</div>
  </section>

  <!-- שקף 2 - ציר זמן השקיה (תבנית C) -->
  <section class="slide" data-name="שקף 2" data-steps="3">
    <div class="topbar">
      <span class="eyebrow">שיעור 2 · גדלים למחר</span>
      <span class="phase-chip">🌱 פאזה 1 – נביטה</span>
    </div>
    <div class="stage-col">
      <p class="h1" style="margin-bottom:5%;">אבני הדרך של ההשקיה</p>
      <div style="display:flex; align-items:center; gap:1.6%;">
        <div class="rv card card-green" data-step="1" style="flex:1;">
          <p class="label label-green">💧 הצפה</p>
          <p class="body" style="margin-top:8px;">לפני כ-6000 שנה</p>
        </div>
        <span class="seq-arrow">←</span>
        <div class="rv card card-lime" data-step="2" style="flex:1;">
          <p class="label label-lime">🇮🇱 טפטוף</p>
          <p class="body" style="margin-top:8px;">שנות ה-60, ישראל</p>
        </div>
        <span class="seq-arrow">←</span>
        <div class="rv card card-amber" data-step="3" style="flex:1;">
          <p class="label label-amber">🤖 אוטומציה</p>
          <p class="body" style="margin-top:8px;">היום</p>
        </div>
      </div>
    </div>
    <div class="mascot">🌱</div>
  </section>

</div>

<div id="controls">
  <button class="navbtn" onclick="slidesGo(-1)">→</button>
  <span id="counter">1 / 2</span>
  <div id="dots"></div>
  <button class="navbtn" onclick="slidesGo(1)">←</button>
  <button class="navbtn" id="fsbtn" title="מסך מלא">⛶</button>
</div>

<script src="assets/slides-core.js"></script>
</body>
</html>
