<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📌 מסע החקלאי | גדלים למחר</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/core.css">
  <script src="assets/core.js"></script>
  <script src="assets/points.config.js"></script>
  <script src="assets/identity.js"></script>
  <script>if(window.GC_ID){GC_ID.ensureStudentIdentity();}</script>
  <style>
    *{font-family:'Heebo',sans-serif;box-sizing:border-box;}
    .level-card{border:3px solid transparent;transition:all .4s;}
    .level-card.active{border-color:#16a34a;transform:scale(1.06);box-shadow:0 8px 32px rgba(22,163,74,.25);}
    .level-card.done{opacity:.7;}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
    .pulse{animation:pulse 1.8s ease-in-out infinite;}
  </style>
</head>
<body class="bg-gradient-to-br from-green-50 to-lime-50 min-h-screen">

<nav class="bg-green-800 text-white sticky top-0 z-50 shadow-xl">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
    <a href="index.html" class="text-xl font-bold">🌱 גדלים למחר</a>
    <div class="flex gap-4 text-sm">
      <a href="index.html" class="hover:text-lime-300">🏠</a>
      <a href="leaves.html" class="hover:text-lime-300">🏆 עלים</a>
      <a href="shop.html" class="hover:text-lime-300">🛒 חנות</a>
      <a href="wall.html" class="hover:text-lime-300">🛠 קיר</a>
    </div>
  </div>
</nav>

<div class="max-w-5xl mx-auto px-6 py-12">
  <h1 class="text-5xl font-black text-center text-green-900 mb-2">📌 מסע החקלאי שלי</h1>
  <p class="text-center text-gray-500 mb-8 text-sm">הרמה שלך נקבעת לפי <b>סכום העלים</b> שצברת בכל השיעורים</p>

  <!-- Total leaves + level summary -->
  <div class="bg-white rounded-3xl shadow-xl p-8 text-center mb-10">
    <div class="text-7xl font-black text-lime-600 mb-2" id="earned-total">0</div>
    <p class="text-gray-500 mb-3">עלים שנצברו בסך הכל 🌿</p>
    <div class="text-3xl font-black text-green-800" id="current-level-name">🌱 זרע</div>
    <!-- Progress to next level -->
    <div class="mt-4 max-w-sm mx-auto">
      <div class="flex justify-between text-xs text-gray-400 mb-1">
        <span id="prog-label">לרמה הבאה</span>
        <span id="prog-pct">0%</span>
      </div>
      <div class="bg-gray-100 rounded-full h-4 overflow-hidden">
        <div id="prog-bar" class="h-4 bg-lime-500 rounded-full transition-all duration-700" style="width:0%"></div>
      </div>
    </div>
  </div>

  <!-- Level cards -->
  <div class="grid md:grid-cols-5 gap-4 mb-10" id="level-cards">
    <!-- filled by JS -->
  </div>

  <!-- Per-lesson progress table -->
  <div class="bg-white rounded-3xl shadow-lg p-6">
    <h2 class="text-2xl font-black text-green-900 mb-5">📊 עלים לפי שיעור</h2>
    <div class="grid grid-cols-4 md:grid-cols-9 gap-2 text-center" id="lesson-bars">
      <!-- filled by JS -->
    </div>
  </div>
</div>

<script>
// Use GC if available (core.js loaded), else fallback
const levels = (window.GC && GC.LEVELS) || [
  [0,'🌱 זרע'],[150,'🌿 שתיל'],[400,'🌳 צמח צעיר'],[700,'🌻 פורח'],[1050,'🏆 חקלאי העתיד'],
];

function getLeavesEarned() {
  let total = 0;
  for (let i = 1; i <= 17; i++) total += parseInt(localStorage.getItem('ls' + i) || '0');
  return total;
}

function render() {
  const earned = getLeavesEarned();
  document.getElementById('earned-total').textContent = earned;

  // Current level
  const curIdx = levels.map(l => l[0]).filter(t => earned >= t).length - 1;
  const cur = levels[curIdx];
  const nxt = levels[curIdx + 1];
  document.getElementById('current-level-name').textContent = cur[1];

  // Progress bar
  if (nxt) {
    const pct = Math.min(100, Math.round((earned - cur[0]) / (nxt[0] - cur[0]) * 100));
    document.getElementById('prog-bar').style.width = pct + '%';
    document.getElementById('prog-pct').textContent = pct + '%';
    document.getElementById('prog-label').textContent = 'לרמה: ' + nxt[1];
  } else {
    document.getElementById('prog-bar').style.width = '100%';
    document.getElementById('prog-pct').textContent = '100%';
    document.getElementById('prog-label').textContent = 'רמה מקסימלית! 🏆';
  }

  // Level cards
  const cardsEl = document.getElementById('level-cards');
  const colors = ['from-green-100 to-lime-100','from-lime-100 to-green-200','from-emerald-100 to-teal-100','from-yellow-100 to-amber-100','from-amber-200 to-yellow-300'];
  const borders = ['border-green-300','border-lime-400','border-teal-400','border-yellow-400','border-amber-500'];
  cardsEl.innerHTML = '';
  levels.forEach((lv, i) => {
    const isActive = i === curIdx;
    const isDone = i < curIdx;
    const div = document.createElement('div');
    div.className = `bg-gradient-to-br ${colors[i]} ${borders[i]} border-2 rounded-2xl p-5 text-center level-card ${isActive ? 'active pulse' : ''} ${isDone ? 'done' : ''}`;
    const pct = isDone ? 100 : (isActive && nxt ? Math.min(100, Math.round((earned - lv[0]) / (nxt[0] - lv[0]) * 100)) : (i > curIdx ? 0 : 100));
    div.innerHTML = `
      <div class="text-3xl mb-2">${lv[1].split(' ')[0]}</div>
      <div class="font-black text-sm text-gray-800 mb-1">${lv[1].split(' ').slice(1).join(' ')}</div>
      <div class="text-xs text-gray-500">${lv[0]}+ עלים</div>
      ${isActive ? `<div class="mt-2 bg-white/60 rounded-full h-1.5 overflow-hidden"><div class="h-1.5 bg-green-600 rounded-full" style="width:${pct}%"></div></div>` : ''}
      ${isDone ? '<div class="text-green-600 mt-2 text-lg">✅</div>' : ''}
    `;
    cardsEl.appendChild(div);
  });

  // Per-lesson bars
  const barsEl = document.getElementById('lesson-bars');
  barsEl.innerHTML = '';
  for (let i = 1; i <= 17; i++) {
    const n = parseInt(localStorage.getItem('ls' + i) || '0');
    const maxN = (window.GC && GC.LESSON_MAX && GC.LESSON_MAX[i]) || 65;
    const pct = Math.min(100, Math.round((n / maxN) * 100));
    const div = document.createElement('div');
    div.className = 'flex flex-col items-center gap-1';
    div.innerHTML = `
      <span class="text-xs font-bold ${n > 0 ? 'text-green-700' : 'text-gray-400'}">${n}</span>
      <div class="w-6 bg-gray-100 rounded-full overflow-hidden" style="height:48px;display:flex;align-items:flex-end;">
        <div class="w-full rounded-full ${n > 0 ? 'bg-lime-500' : 'bg-gray-200'}" style="height:${pct}%;transition:height .5s;"></div>
      </div>
      <span class="text-xs text-gray-400">${i}</span>
    `;
    barsEl.appendChild(div);
  }
}

render();
</script>
</body>
</html>
